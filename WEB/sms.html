<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Looping Fetch API</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .keterangan { margin-bottom: 20px; padding: 10px; background-color: #f0f0f0; border-radius: 5px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="keterangan">
        <p><strong>Status:</strong> <span id="status">Menunggu untuk dimulai...</span></p>
        <h2>Jumlah Fetch Sukses: <span id="count">0</span></h2>
    </div>

    <button id="startBtn">Mulai Fetch</button>
    <button id="stopBtn">Berhenti</button>

    <script>
        let isFetching = false;
        let successCount = 0;

        // Fungsi utilitas untuk memberikan jeda (delay)
        // Ini sangat penting agar tidak melakukan request terlalu cepat
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startFetching() {
            isFetching = true;
            successCount = 0; // Reset counter saat dimulai ulang
            
            document.getElementById('count').innerText = successCount;
            document.getElementById('status').innerText = 'Proses fetch sedang berjalan...';

            // Loop akan berjalan selama isFetching bernilai true
            while (isFetching) {
                try {
                    // Menggunakan API dummy yang aman untuk pengujian
                    const response = await fetch("https://paxapi.vercel.app/api/v1/otp?nomor=082228895081&apiKey=pxbr_live_qw7qnvqfb7e5m7ikyrywkycx");

                    if (response.status === 200) {
                        // Jika sukses (200), tambahkan counter
                        successCount++;
                        document.getElementById('count').innerText = successCount;
                        
                        console.log(`Fetch sukses ke-${successCount}`);

                        // Jeda 2 detik sebelum melakukan fetch berikutnya
                        await delay(2000); 
                    } else {
                        // Jika status bukan 200, hentikan loop
                        document.getElementById('status').innerText = `Dihentikan: Server mengembalikan status ${response.status}`;
                        isFetching = false; 
                    }
                } catch (error) {
                    // Tangani jika terjadi error jaringan (misal internet putus)
                    document.getElementById('status').innerText = 'Dihentikan: Terjadi kesalahan jaringan';
                    console.error('Error saat fetch:', error);
                    isFetching = false;
                }
            }
        }

        // Event listener untuk tombol
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isFetching) {
                startFetching();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            if (isFetching) {
                isFetching = false;
                document.getElementById('status').innerText = 'Dihentikan secara manual oleh pengguna.';
            }
        });
    </script>
</body>
</html>
